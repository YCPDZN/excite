<!doctype html><html><head><meta charset="utf-8"><title>Anita Sharma rig preview</title></head><body style="margin:0;background:#cfd8df">
<canvas id="c" width="900" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { buildAnita } from './anita_rig.js';
const { root, clips } = buildAnita();
const exporter = new GLTFExporter();
window.glb = await new Promise((res, rej) => exporter.parse(root, r => res(r), rej, { binary: true, animations: clips }));
const bytes = new Uint8Array(window.glb); let s = ''; for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
window.glbB64 = btoa(s);
// reload the exported GLB and pose it for previews
const gltf = await new GLTFLoader().parseAsync(window.glb.slice(0), '');
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xcfd8df);
sc.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2)); const dl = new THREE.DirectionalLight(0xffffff, 1.5); dl.position.set(2, 4, 3); sc.add(dl);
const models = [];
for (let i = 0; i < 4; i++) { const m = i === 0 ? gltf.scene : (await new GLTFLoader().parseAsync(window.glb.slice(0), '')).scene; m.position.x = (i - 1.5) * 0.9; sc.add(m); models.push(m); }
const cam = new THREE.PerspectiveCamera(30, 1.5, 0.1, 50); cam.position.set(0.6, 1.3, 5.2); cam.lookAt(0, 0.95, 0);
window.pose = (t, yaw) => {
  models.forEach((m, i) => { const mx = new THREE.AnimationMixer(m); mx.clipAction(gltf.animations[i]).play(); mx.setTime(t * gltf.animations[i].duration); m.rotation.y = yaw; });
  r.render(sc, cam);
};
window.clipNames = gltf.animations.map(a => a.name);
window.ready = true; pose(0.3, 0);
// Download button: saves a freshly built anita_sharma.glb
const btn = document.createElement('button'); btn.textContent = 'Download anita_sharma.glb';
btn.style.cssText = 'position:fixed;top:12px;left:12px;font:600 14px system-ui;padding:8px 12px';
btn.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([window.glb], { type: 'model/gltf-binary' })); a.download = 'anita_sharma.glb'; a.click(); };
document.body.appendChild(btn);
let t = 0; (function loop() { t = (t + 0.004) % 1; pose(t, Math.sin(t * Math.PI * 2) * 0.6); requestAnimationFrame(loop); })();
</script></body></html>
